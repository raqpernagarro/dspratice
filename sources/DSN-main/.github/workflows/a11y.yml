name: Accessibility Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers        # ← ADD THIS
        run: npx playwright install --with-deps chromium

      - name: Run keyboard contract tests
        run: npm run test:a11y:keyboard-widgets

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Storybook a11y sweeps (light + dark)
        run: |
          npx --yes http-server ./storybook-static -p 6006 &
          SERVER_PID=$!
          sleep 5
          npm run test:a11y:stories:light
          npm run test:a11y:stories:dark
          kill $SERVER_PID