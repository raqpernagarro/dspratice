# Runs on every pull request into main (and on main itself): the same checks you can run locally.
#   npm run ds:generate -- --check   generated files match the specs
#   npm test                         every story renders, with no accessibility problems
#   npm run build-storybook          Storybook (including the docs pages) builds
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            variables-github-action/package-lock.json

      - run: npm ci
      - run: npm ci --prefix variables-github-action

      - name: Generated files match the specs
        run: npm run ds:generate -- --check

      - run: npx playwright install --with-deps chromium

      - name: Tests (every story, with accessibility checks)
        run: npm test

      - name: Storybook builds
        run: npm run build-storybook -- --quiet
