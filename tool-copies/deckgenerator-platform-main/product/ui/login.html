<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Nagarro Presentations</title>

  <!--
    Authentication screen — Milestone M5 (Phase 3 §04, Phase 5 §10).
    Deferred from M4 by explicit ruling; M5 is the first milestone that
    introduces authenticated navigation, so it lands here.

    Phase 3 §15: the brand system is reused, never restated — tokens.css and
    dashboard.css are linked unmodified; app.css adds only product chrome.
  -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="app.css" />
  <script>
    // Applied before first paint so a stored choice never flashes the wrong
    // theme. Absent attribute = auto (app.css follows the OS).
    try { var t = localStorage.getItem("nps:theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body class="dashboard auth">
  <main class="auth-card">
    <span class="auth-card__brand" id="brand" aria-hidden="true"></span>

    <h1>Sign in</h1>
    <p class="auth-card__sub">Nagarro Presentations</p>

    <div id="banner" hidden></div>

    <form id="login-form" novalidate>
      <div class="field" id="field-email">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username"
               autocapitalize="none" spellcheck="false" required />
      </div>

      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn--primary" id="submit">Sign in</button>
    </form>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
