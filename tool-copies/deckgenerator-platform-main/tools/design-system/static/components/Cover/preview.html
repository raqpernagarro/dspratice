<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nagarro Master Slides</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg-primary); color: var(--fg-100); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; width: 960px; height: 112px; }
  .band svg { display: block; width: 960px; height: 112px; }
  .ink { fill: var(--fg-100); }
  .mint { fill: var(--accent-primary); }
  .tint { fill: var(--fg-20); }
  .cut { stroke: var(--bg-primary); stroke-width: 1; fill: none; }
  .cut-thin { stroke: var(--bg-primary); stroke-width: 0.5; fill: none; }
  .words { position: absolute; left: var(--space-40); bottom: var(--space-32); max-width: 880px; }
  .name { margin: 0; font-size: 56px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; color: var(--fg-100); }
  .tag { margin: var(--space-16) 0 0 2px; font-family: var(--font-body); font-size: 14px; line-height: 20px; color: var(--fg-50); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 112" width="960" height="112">
<!--
  blocks      fg-100 slab 420×112 bled off top-left (a dark slide; inverts in Dark) · accent-primary 199×112 (16:9, the accent at full value) · fg-20 199×112 (16:9) · fg-100 94×112 bled off the right
  arrangement a strip of unequal bands across the top, space-16 apart, square corners like the 1920×1080 canvas (radius 15px is for cards, not slides)
  pattern     hairlines cut out of the ink slab: the header divider and the three footer-column rules of the slide frame — the system's own structure, "hierarchy from scale and space, not decoration"
  scales      gaps space-16; rules stroke-thin 0.5px and 1px; no radius
-->
  <rect class="ink" x="-20" y="-20" width="440" height="132"/>
  <line class="cut" x1="0" y1="40" x2="404" y2="40"/>
  <line class="cut-thin" x1="16" y1="92" x2="136" y2="92"/>
  <line class="cut-thin" x1="148" y1="92" x2="268" y2="92"/>
  <line class="cut-thin" x1="280" y1="92" x2="404" y2="92"/>
  <rect class="mint" x="436" y="0" width="199" height="112"/>
  <rect class="tint" x="651" y="0" width="199" height="112"/>
  <rect class="ink" x="866" y="0" width="114" height="112"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Nagarro Master Slides</h1>
  <p class="tag">One canvas, one frame, 508 master slides.</p>
</div>
</div>
</body>
</html>
